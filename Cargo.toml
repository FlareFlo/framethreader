[workspace]
members = ["realbin/*"]
resolver = "2"

[package]
name = "framethreader"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
env_logger = "0.11.11"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
pollster = "0.3"
rayon = "1.8"
bytemuck = { version = "1.18", features = ["derive"] }
indicatif = "0.18.6"
kamadak-exif = "0.6.1"
chrono = "0.4"

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.jpeg-decoder]
opt-level = 3